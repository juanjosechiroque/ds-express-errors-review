services:
    mongo:
        image: mongo:8.0
        restart: unless-stopped
        ports:
            - "${MONGO_PORT:-27017}:27017"
        volumes:
            - mongo-data:/data/db
        healthcheck:
            test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 10s

volumes:
    mongo-data:
